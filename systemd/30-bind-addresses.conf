# Tailnet path (FLEET-WORKER2-BUILD-20260811-tower-tailnet-path).
#
# Adds alpha's Tailscale address alongside loopback so fleet boxes and David's
# own devices reach Tower directly over WireGuard instead of round-tripping
# through Cloudflare's edge. server.py binds these EXPLICITLY, one socket each —
# never 0.0.0.0 — so the LAN stays unreachable, and CfAccessJWTMiddleware only
# extends implicit trust to loopback and 100.64/10 peers that carry no Cloudflare
# edge headers.
#
# The tunnel remains the path for the claude.ai connector and is the only path
# with Standby DR failover. Delete this file and restart for a full rollback:
# server.py defaults to 127.0.0.1 on its own.
[Service]
Environment=TOWER_BIND_ADDRESSES=127.0.0.1,100.64.0.36
